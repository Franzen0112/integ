<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJRK STUDIO - Register</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #434343 0%, #1a1a2e 50%, #16213e 100%);
      background-image: url('images/camera.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .register-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    .register-form {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .register-form:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(-5px);
    }

    .register-form h1 {
      text-align: center;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.3s ease;
    }

    .form-group input:hover {
      border-bottom-color: rgba(255, 255, 255, 0.8);
    }

    .form-group input:hover::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    .form-group input:focus {
      border-bottom-color: #fff;
      border-bottom-width: 2px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .password-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 18px;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .password-toggle:hover {
      color: #fff;
      transform: translateY(-50%) scale(1.2);
    }

    .password-toggle:active {
      transform: translateY(-50%) scale(1);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .terms-checkbox {
      display: flex;
      align-items: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .terms-checkbox:hover {
      opacity: 0.9;
    }

    .terms-checkbox input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.2s ease;
    }

    .terms-checkbox:hover input[type="checkbox"] {
      transform: scale(1.1);
    }

    .terms-checkbox a {
      color: #fff;
      text-decoration: underline;
      margin-left: 5px;
    }

    .register-button {
      width: 100%;
      padding: 15px;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .register-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .register-button:hover::before {
      width: 300px;
      height: 300px;
    }

    .register-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
      background: #f8f9ff;
    }

    .register-button:active {
      transform: translateY(-1px);
    }

    .register-button span {
      position: relative;
      z-index: 1;
    }

    .login-link {
      text-align: center;
      color: #fff;
      font-size: 14px;
    }

    .login-link a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 5px;
      display: inline-block;
    }

    .login-link a:hover {
      opacity: 0.9;
      text-decoration: underline;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    @media(max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .register-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-form">
      <a href="dashboard.html" style="display: inline-flex; align-items: center; color: #fff; text-decoration: none; margin-bottom: 20px; font-size: 14px; transition: all 0.3s ease; padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.1);" onmouseover="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.transform='translateX(-3px)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.transform='translateX(0)'">
        <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
        <span>Back to Dashboard</span>
      </a>
      <h1>Register</h1>

      <div id="registerNotice" style="background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; padding:12px 14px; border-radius:10px; margin-bottom:18px; font-size:13px; line-height:1.5;">
        <strong>New email?</strong> Sign Up to create an account.<br>
        <strong>Already have an account?</strong> Enter the same email + password — you will be <strong>logged in automatically</strong> (no duplicate signup). Or use <a href="login.html" style="color:#fff; font-weight:700;">Login</a>.
      </div>
      
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Enter your email</label>
            <input type="email" id="email" name="email" placeholder="you@gmail.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
          </div>

          <div class="form-group">
            <label for="password">Enter your password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="togglePassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
              <button type="button" class="password-toggle" id="toggleConfirmPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-options">
          <label class="terms-checkbox">
            <input type="checkbox" required>
            I agree to the <a href="#">Terms & Conditions</a>
          </label>
        </div>

        <button type="submit" class="register-button"><span>Sign Up</span></button>
      </form>

      <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="auth-common.js"></script>

  <script>
    // Password toggle functionality for password field
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = togglePassword.querySelector('i');

    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Toggle eye icon
      if (type === 'password') {
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      } else {
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      }
    });

    // Password toggle functionality for confirm password field
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const confirmEyeIcon = toggleConfirmPassword.querySelector('i');

    toggleConfirmPassword.addEventListener('click', function() {
      const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPasswordInput.setAttribute('type', type);
      
      // Toggle eye icon
      if (type === 'password') {
        confirmEyeIcon.classList.remove('fa-eye-slash');
        confirmEyeIcon.classList.add('fa-eye');
      } else {
        confirmEyeIcon.classList.remove('fa-eye');
        confirmEyeIcon.classList.add('fa-eye-slash');
      }
    });

    async function setupFormHandler() {
      try {
        await window.authCommon.ensureAuthReady();
      } catch (err) {
        alert(err.message);
        return;
      }

      if (await window.authCommon.tryRestoreSession()) {
        return;
      }

      const form = document.getElementById('registerForm');
      const submitBtn = form.querySelector('.register-button span');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!window.authCommon.isValidEmail(email)) {
          alert('Enter a valid email (example: name@gmail.com). Usernames cannot be used.');
          return;
        }
        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return;
        }
        if (password.length < 6) {
          alert('Password must be at least 6 characters.');
          return;
        }

        const originalBtnText = submitBtn ? submitBtn.textContent : 'Sign Up';
        if (submitBtn) submitBtn.textContent = 'Please wait...';
        form.querySelector('.register-button').disabled = true;

        try {
          await window.authCommon.ensureAuthReady();
          const result = await window.db.registerUser(email, password, {
            fullname: fullname,
            phone: phone
          });

          if (result.error) {
            const msg = result.error.userMessage || result.error.message || 'Unknown error';
            if (result.needsEmailConfirm) {
              alert(msg);
              window.location.href = 'login.html?email=' + encodeURIComponent(email) + '&confirm=1';
              return;
            }
            if (confirm(msg + '\n\nOpen Login page?')) {
              window.location.href = 'login.html?email=' + encodeURIComponent(email);
            }
            return;
          }

          const authData = result.data;
          const user = authData && (authData.user || authData.session?.user);

          if (user && (result.viaLogin || result.status === 'logged_in')) {
            await window.authCommon.redirectAfterAuth(user, email);
            return;
          }

          if (user && (authData.session || result.status === 'registered')) {
            await window.authCommon.redirectAfterAuth(user, email);
            return;
          }

          if (result.needsEmailConfirm) {
            alert(
              'Account created for ' + email + '.\n\n' +
              'Confirm email in Supabase (Users → Confirm email) or turn OFF Confirm email, then Login.'
            );
            window.location.href = 'login.html?email=' + encodeURIComponent(email) + '&confirm=1';
            return;
          }

          alert('Something went wrong. Try Login with your email and password.');
          window.location.href = 'login.html?email=' + encodeURIComponent(email);
        } catch (error) {
          alert(error.message || 'Registration failed.');
        } finally {
          if (submitBtn) submitBtn.textContent = originalBtnText;
          form.querySelector('.register-button').disabled = false;
        }
      });
    }

    window.addEventListener('load', setupFormHandler);
  </script>
</body>
</html>
