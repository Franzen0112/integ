<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJRK STUDIO - Register</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('images/camera.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .register-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    .register-form {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .register-form:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(-5px);
    }

    .register-form h1 {
      text-align: center;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.3s ease;
    }

    .form-group input:hover {
      border-bottom-color: rgba(255, 255, 255, 0.8);
    }

    .form-group input:hover::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    .form-group input:focus {
      border-bottom-color: #fff;
      border-bottom-width: 2px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .password-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 18px;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .password-toggle:hover {
      color: #fff;
      transform: translateY(-50%) scale(1.2);
    }

    .password-toggle:active {
      transform: translateY(-50%) scale(1);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .terms-checkbox {
      display: flex;
      align-items: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .terms-checkbox:hover {
      opacity: 0.9;
    }

    .terms-checkbox input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.2s ease;
    }

    .terms-checkbox:hover input[type="checkbox"] {
      transform: scale(1.1);
    }

    .terms-checkbox a {
      color: #fff;
      text-decoration: underline;
      margin-left: 5px;
    }

    .register-button {
      width: 100%;
      padding: 15px;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .register-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .register-button:hover::before {
      width: 300px;
      height: 300px;
    }

    .register-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
      background: #f8f9ff;
    }

    .register-button:active {
      transform: translateY(-1px);
    }

    .register-button span {
      position: relative;
      z-index: 1;
    }

    .login-link {
      text-align: center;
      color: #fff;
      font-size: 14px;
    }

    .login-link a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 5px;
      display: inline-block;
    }

    .login-link a:hover {
      opacity: 0.9;
      text-decoration: underline;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    @media(max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .register-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-form">
      <a href="dashboard.html" style="display: inline-flex; align-items: center; color: #fff; text-decoration: none; margin-bottom: 20px; font-size: 14px; transition: all 0.3s ease; padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.1);" onmouseover="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.transform='translateX(-3px)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.transform='translateX(0)'">
        <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
        <span>Back to Dashboard</span>
      </a>
      <h1>Register</h1>
      
      <form>
        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Enter your email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
          </div>

          <div class="form-group">
            <label for="password">Enter your password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="togglePassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
              <button type="button" class="password-toggle" id="toggleConfirmPassword">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-options">
          <label class="terms-checkbox">
            <input type="checkbox" required>
            I agree to the <a href="#">Terms & Conditions</a>
          </label>
        </div>

        <button type="submit" class="register-button"><span>Sign Up</span></button>
      </form>

      <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

  <script>
    // Password toggle functionality for password field
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = togglePassword.querySelector('i');

    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Toggle eye icon
      if (type === 'password') {
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      } else {
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      }
    });

    // Password toggle functionality for confirm password field
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const confirmEyeIcon = toggleConfirmPassword.querySelector('i');

    toggleConfirmPassword.addEventListener('click', function() {
      const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPasswordInput.setAttribute('type', type);
      
      // Toggle eye icon
      if (type === 'password') {
        confirmEyeIcon.classList.remove('fa-eye-slash');
        confirmEyeIcon.classList.add('fa-eye');
      } else {
        confirmEyeIcon.classList.remove('fa-eye');
        confirmEyeIcon.classList.add('fa-eye-slash');
      }
    });

    // Wait for all scripts to load before setting up form handler
    function setupFormHandler() {
      // Debug: Check what's loaded
      console.log('Setting up form handler...');
      console.log('window.supabase:', typeof window.supabase);
      console.log('window.supabaseClient:', window.supabaseClient);
      console.log('window.db:', typeof window.db);
      
      // Check if Supabase library is loaded
      if (typeof window.supabase === 'undefined') {
        console.error('❌ Supabase library not loaded!');
        alert('Supabase library failed to load. Please refresh the page.');
        return;
      }
      
      // Check if Supabase client is initialized
      if (!window.supabaseClient) {
        console.error('❌ Supabase client not initialized!');
        console.log('Retrying initialization...');
        // Try to initialize again
        if (typeof initializeSupabaseClient === 'function') {
          initializeSupabaseClient();
        }
        setTimeout(function() {
          if (!window.supabaseClient) {
            alert('Database connection failed. Please check:\n1. Internet connection\n2. Browser console for errors (F12)\n3. Refresh the page');
          }
        }, 1000);
      } else {
        console.log('✅ Supabase client initialized');
      }
      
      // Check if db functions are available
      if (typeof window.db === 'undefined' || !window.db.registerUser) {
        console.error('❌ Database functions not loaded. Make sure supabase-config.js and db.js are loaded.');
        alert('Database functions not loaded. Please refresh the page.');
        return;
      }
      
      console.log('✅ All scripts loaded successfully');

      // Password match validation and Supabase registration
      const form = document.querySelector('form');
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;

        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return false;
        }

        // Validate password strength (at least 6 characters)
        if (password.length < 6) {
          alert('Password must be at least 6 characters long!');
          return false;
        }

        // Check if Supabase is initialized
        if (!window.supabaseClient) {
          alert('Database connection not ready. Please refresh the page and try again.');
          console.error('Supabase client not initialized');
          return;
        }

        // Register user with Supabase
        try {
          const result = await window.db.registerUser(email, password, {
            fullname: fullname,
            phone: phone
          });

          if (result.error) {
            console.error('Registration error details:', result.error);
            let errorMessage = 'Registration failed: ';
            
            // More specific error messages
            if (result.error.message.includes('already registered')) {
              errorMessage += 'This email is already registered. Please use a different email or try logging in.';
            } else if (result.error.message.includes('relation') && result.error.message.includes('does not exist')) {
              errorMessage += 'Database tables not set up. Please contact the administrator.';
            } else if (result.error.message.includes('duplicate key')) {
              errorMessage += 'This email is already registered.';
            } else {
              errorMessage += result.error.message || 'Unknown error occurred.';
            }
            
            alert(errorMessage);
            return;
          }

          alert('Registration successful! Please check your email to verify your account, then you can login.');
          window.location.href = 'login.html';
        } catch (error) {
          console.error('Registration error:', error);
          let errorMessage = 'An error occurred during registration. ';
          
          if (error.message) {
            errorMessage += error.message;
          } else if (error.toString) {
            errorMessage += error.toString();
          }
          
          alert(errorMessage);
        }
      });
    }

    // Wait for scripts to load
    window.addEventListener('load', function() {
      // Give scripts a moment to initialize
      setTimeout(function() {
        setupFormHandler();
      }, 500);
    });
  </script>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Configuration -->
  <script src="supabase-config.js"></script>
  <!-- Database Utility Functions -->
  <script src="db.js"></script>
</body>
</html>
